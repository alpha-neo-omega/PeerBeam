name: release
# Build production artifacts for every platform on a version tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # x86_64 and arm64 build natively — GitHub's arm64 runners are free for public
  # repositories, and cross-compiling a Flutter Linux desktop bundle is far more
  # trouble than a second runner. `fail-fast: false` so a problem on one
  # architecture cannot take the other's artifacts down with it.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    appimage_arch: x86_64,  artifact: linux }
          - { runner: ubuntu-24.04-arm, appimage_arch: aarch64, artifact: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: System deps
        run: |
          sudo apt-get update
          # imagemagick, not librsvg: the icon master is a PNG that needs resizing,
          # and package-linux.sh looks for `magick`/`convert`. librsvg2-bin renders
          # SVGs and satisfies neither, so icons were silently skipped every build.
          sudo apt-get install -y ninja-build libgtk-3-dev dpkg-dev rpm imagemagick librsvg2-bin
      # appimagetool is not packaged; fetch the official binary for this
      # architecture. Run it with --appimage-extract-and-run because GitHub
      # runners have no FUSE, which a plain AppImage needs to mount itself.
      - name: appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage
          chmod +x /tmp/appimagetool
          printf '#!/bin/sh\nexec /tmp/appimagetool --appimage-extract-and-run "$@"\n' \
            | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true
      - run: flutter config --enable-linux-desktop && (cd flutter && flutter pub get)
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: ${{ matrix.artifact }}, path: dist/* }

  windows:
    runs-on: windows-latest
    # Needs signing secrets; don't block the release if they're absent.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-windows-desktop; cd flutter; flutter pub get
      - name: Package (MSIX)
        env:
          PB_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
          PB_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: powershell -File scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            flutter/build/windows/x64/runner/Release/*.msix
            dist/*.zip

  macos:
    runs-on: macos-latest
    # Needs signing/notarization secrets; don't block the release if absent.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-macos-desktop && (cd flutter && flutter pub get)
      - name: Package (DMG, sign + notarize)
        env:
          PB_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          PB_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          PB_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd flutter && flutter pub get
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > flutter/android/peerbeam-release.jks
            printf '%s' "$KEY_PROPERTIES" > flutter/android/key.properties
          fi
      - run: bash scripts/package-android.sh
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  # Standalone CLI binaries — pure cargo, no Flutter/signing, so they build fast
  # and reliably for every desktop OS. The release waits on these (unlike the
  # signed GUI jobs) so the CLI ships on every platform.
  # Native per architecture, same reasoning as the GUI job. Only the x64 leg
  # emits the shell completions: they are identical whoever generates them, and
  # two copies would collide on basename when the release uploads by basename.
  cli-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    suffix: x64,   completions: true,  artifact: cli-linux }
          - { runner: ubuntu-24.04-arm, suffix: arm64, completions: false, artifact: cli-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path rust/Cargo.toml --release -p peerbeam-cli
      - name: Stage CLI + shell completions
        run: |
          mkdir -p out
          cp rust/target/release/peerbeam out/peerbeam-linux-${{ matrix.suffix }}
          if [ "${{ matrix.completions }}" = "true" ]; then
            rust/target/release/peerbeam completions bash > out/peerbeam.bash
            rust/target/release/peerbeam completions zsh  > out/_peerbeam
            rust/target/release/peerbeam completions fish > out/peerbeam.fish
          fi
      - uses: actions/upload-artifact@v4
        with: { name: ${{ matrix.artifact }}, path: out/* }

  cli-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path rust/Cargo.toml --release -p peerbeam-cli
      - run: mkdir -p out && cp rust/target/release/peerbeam out/peerbeam-macos-arm64
      - uses: actions/upload-artifact@v4
        with: { name: cli-macos, path: out/* }

  cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path rust/Cargo.toml --release -p peerbeam-cli
      - name: Stage CLI
        run: |
          New-Item -ItemType Directory -Force -Path out
          Copy-Item rust\target\release\peerbeam.exe out\peerbeam-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with: { name: cli-windows, path: out/* }

  # Publish the GitHub Release. Requires the no-secret builds (Linux GUI +
  # Android + the three CLI jobs). Unsigned GUI artifacts (Linux tar/deb, Windows
  # portable zip, macOS universal DMG) ARE attached; the signed variants
  # (notarized DMG / signed MSIX) await their signing secrets. Uses the built-in
  # GITHUB_TOKEN.
  release:
    needs: [linux, windows, android, cli-linux, cli-macos, cli-windows]
    # `linux` and `cli-linux` are matrices; needing them waits for every leg.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # A re-pushed tag reruns this job against an existing release. Patching
      # that object in place proved flaky (stale asset names linger; uploads
      # against it hit 'Too many retries'), so drop it and publish fresh — the
      # next step recreates it from the tag.
      - name: Remove existing release (tag re-runs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$GITHUB_REF_NAME" -y --repo "$GITHUB_REPOSITORY" \
            || echo "no existing release for $GITHUB_REF_NAME"
      # Plain `gh` instead of an action: upload errors are visible in the log
      # (softprops died twice with an opaque 'Too many retries').
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          # Top-level files only: artifact dirs also carry build-debris
          # subtrees (e.g. the deb staging tree), whose contents collide on
          # basename (gh names assets by basename -> 422 duplicate).
          mapfile -t files < <(find artifacts/linux artifacts/linux-arm64 \
            artifacts/android artifacts/cli-linux artifacts/cli-linux-arm64 \
            artifacts/cli-macos artifacts/cli-windows \
            -maxdepth 1 -type f 2>/dev/null)
          # Windows GUI ships as the portable zip only (MSIX awaits signing).
          # The windows artifact preserves subdirs (multi-path upload), so
          # search at any depth; the basename is unique.
          mapfile -t -O "${#files[@]}" files < <(find artifacts/windows \
            -type f -name '*.zip' 2>/dev/null)
          # macOS GUI ships as the unsigned/un-notarized universal DMG (runs on
          # Intel + Apple Silicon); the notarized DMG awaits signing secrets.
          mapfile -t -O "${#files[@]}" files < <(find artifacts/macos \
            -maxdepth 1 -type f -name '*.dmg' 2>/dev/null)
          printf 'upload: %s\n' "${files[@]}"
          # Hand-written notes when the tag carries them, generated notes when
          # it does not. This used to be an unconditional --notes-file, which
          # meant a tag without one failed the job *after* every platform had
          # built — and, because the step above deletes the existing release
          # first, a re-pushed tag destroyed a good release and put nothing
          # back. Releases for v0.4.1, v0.5.0 and v0.6.0 were lost exactly that
          # way. Missing notes are a documentation gap, not a reason to throw
          # away six platforms' artifacts.
          notes_file="docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          else
            echo "::warning::${notes_file} is missing — publishing with generated notes. Add it and re-push the tag to replace them."
            notes=(--generate-notes)
          fi
          if ! gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --prerelease --verify-tag \
            "${notes[@]}" \
            "${files[@]}" 2> /tmp/gh-err.txt; then
            # Surface the real error as annotations (readable without log auth).
            while IFS= read -r line; do echo "::error::gh: ${line}"; done < /tmp/gh-err.txt
            exit 1
          fi
