name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test · examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Examples compile
        run: cargo build --examples

  flutter:
    name: Flutter (analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # Android's Kotlin unit tests, which for a long time ran nowhere: every
  # Android defect this project found was found by reading the code.
  #
  # This job is deliberately NOT a full Android build. Compiling the engine for
  # Android needs the NDK (`ring` runs a C build script even for `cargo check`)
  # and takes many minutes; the release workflow already does that on a tag.
  # What was missing was any check at all on the Kotlin, and these tests are
  # cheap.
  #
  # Two earlier attempts failed, and both reasons are handled explicitly below
  # rather than left to be rediscovered:
  #
  # 1. `./gradlew` is exit 127 on a fresh checkout — Flutter's Android template
  #    `.gitignore`s `/gradlew`, so the wrapper *properties* are committed and
  #    the script is not. It is generated here from those properties.
  # 2. `flutter pub get` alone does not write `android/local.properties`, which
  #    Flutter's `settings.gradle.kts` reads for `flutter.sdk`. `--config-only`
  #    writes it without building anything.
  #
  # Scoped to `:app:` on purpose: a bare `testDebugUnitTest` also builds the
  # unit tests of every plugin, and `mobile_scanner`'s do not compile. That is
  # a third-party module's problem and not something this repository should
  # fail on.
  android:
    name: Android (kotlin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve plugins
        run: cd flutter && flutter pub get
      - name: Write local.properties (no build)
        run: cd flutter && flutter build apk --config-only
      - name: Generate the Gradle wrapper
        # The template gitignores it; the properties are committed, so this
        # produces exactly the version the project pins.
        run: cd flutter/android && gradle wrapper
      - name: Kotlin unit tests
        run: cd flutter/android && ./gradlew :app:testDebugUnitTest --console=plain
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: flutter/build/app/test-results/**/*.xml
          if-no-files-found: warn

  # Cross-platform proof: the Rust engine and the desktop app must build (and
  # the engine's tests pass) on every desktop OS. Intel macOS is covered from
  # the Apple Silicon runner: x86_64 tests execute under Rosetta 2 (real
  # Intel-arch binaries) and the Flutter app builds universal — GitHub's
  # Intel (macos-13) runners are deprecated and queue-starved.
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            build: flutter build windows --release
          - os: macos-latest
            label: macos-arm64+x64
            build: flutter build macos --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust tests
        working-directory: rust
        shell: bash
        # On failure, surface the failing tests/panics as annotations so the
        # cause is visible without downloading runner logs.
        run: |
          set -o pipefail
          if ! cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/test-out.txt; then
            grep -E "^(test .+ \.\.\. FAILED|---- .+ ----|thread .+ panicked.*|error(\[[^]]+\])?:.*)" /tmp/test-out.txt \
              | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      # **Unit tests only** (`--lib --bins`), deliberately.
      #
      # This leg exists to prove the Intel-arch build compiles and its logic
      # holds. It cannot prove anything about networking: the integration tests
      # drive real QUIC over loopback with keep-alives and idle timeouts, and
      # emulated x86 on Apple silicon starves the runtime long enough to drop
      # connections — `quic: connection lost`, then a dozen tests waiting for
      # events that will never arrive. Those failures describe Rosetta, not the
      # Intel binaries users run, and they were drowning real signal.
      #
      # The native arm64 step above runs the whole suite, so integration
      # coverage is not lost — only moved off the emulator.
      - name: Rust tests (x86_64 under Rosetta)
        if: runner.os == 'macOS'
        working-directory: rust
        shell: bash
        run: |
          set -o pipefail
          rustup target add x86_64-apple-darwin
          if ! cargo test --workspace --lib --bins --no-fail-fast --target x86_64-apple-darwin 2>&1 | tee /tmp/test-x64.txt; then
            grep -E "^(test .+ \.\.\. FAILED|---- .+ ----|thread .+ panicked.*|error(\[[^]]+\])?:.*)" /tmp/test-x64.txt \
              | head -40 | while IFS= read -r line; do echo "::error::x86_64: ${line}"; done
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get
      - name: Build desktop app
        working-directory: flutter
        run: ${{ matrix.build }}
      - name: Verify universal mac binary (arm64 + x86_64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN=$(find flutter/build/macos -name peerbeam -type f -path "*MacOS*" | head -1)
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q x86_64 || { echo "::error::mac app is not universal"; exit 1; }
