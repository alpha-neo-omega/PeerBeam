[package]
name = "peerbeam-cli"
description = "PeerBeam command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "peerbeam_cli"
path = "src/lib.rs"

[[bin]]
name = "peerbeam"
path = "src/main.rs"

[dependencies]
peerbeam-domain = { workspace = true }
peerbeam-config = { workspace = true }
peerbeam-platform = { workspace = true }
peerbeam-engine = { path = "../../crates/peerbeam-engine" }
peerbeam-app = { workspace = true }
peerbeam-discovery-udp = { path = "../../crates/peerbeam-discovery-udp" }
peerbeam-discovery-mdns = { path = "../../crates/peerbeam-discovery-mdns" }
peerbeam-discovery-tailscale = { path = "../../crates/peerbeam-discovery-tailscale" }
peerbeam-crypto = { path = "../../crates/peerbeam-crypto" }
peerbeam-trust-fs = { path = "../../crates/peerbeam-trust-fs" }
peerbeam-identity-fs = { path = "../../crates/peerbeam-identity-fs" }
peerbeam-transfer = { path = "../../crates/peerbeam-transfer" }
peerbeam-transfer-quic = { path = "../../crates/peerbeam-transfer-quic" }
peerbeam-storage-fs = { path = "../../crates/peerbeam-storage-fs" }
peerbeam-reliability-fs = { path = "../../crates/peerbeam-reliability-fs" }
peerbeam-appstore-fs = { path = "../../crates/peerbeam-appstore-fs" }
peerbeam-browse = { path = "../../crates/peerbeam-browse" }
peerbeam-sync = { path = "../../crates/peerbeam-sync" }
peerbeam-chat = { path = "../../crates/peerbeam-chat" }
peerbeam-pairing = { path = "../../crates/peerbeam-pairing" }
peerbeam-logs = { path = "../../crates/peerbeam-logs" }
peerbeam-notes = { path = "../../crates/peerbeam-notes" }
peerbeam-clipboard = { path = "../../crates/peerbeam-clipboard" }
peerbeam-presence = { path = "../../crates/peerbeam-presence" }
# `io-std` on top of the workspace feature set: `peerbeam pipe` is the only
# thing in the project that reads stdin or writes stdout asynchronously, so the
# feature is enabled here rather than workspace-wide. It pulls in no new crate —
# tokio's async stdio rides the blocking pool the runtime already has.
tokio = { workspace = true, features = ["io-std"] }
# Bridges tokio's stdin/stdout to the `futures` IO traits the transfer engine
# (and the domain's StorageProvider port) speak, so `pipe` reuses that engine's
# chunk loop verbatim instead of growing a second one for tokio-flavoured IO.
# Not a new dependency for the project: `peerbeam-storage-fs`, which this crate
# already pulls in, builds it for exactly the same reason.
tokio-util = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
arboard = "3.6.1"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }
